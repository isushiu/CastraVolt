[project]
name = "castravolt"
version = "0.1.0"
description = "CastraVolt urban EV infrastructure planning API"
readme = "README.md"
authors = [
    { name = "Ettic", email = "muhdalifasyraf46@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2,<3",
    "truststore==0.10.5",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
castravolt = "castravolt:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
model-validation = [
    "joblib>=1.4,<2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "xgboost==3.4.1",
]
poi-build = [
    "osmium>=4.3.2",
]
